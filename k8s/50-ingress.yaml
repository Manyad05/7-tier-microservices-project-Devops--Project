# Optional: minikube addons enable ingress   (then run `minikube tunnel` on Windows/macOS)
# Add "127.0.0.1 shop.local" to your hosts file and open http://shop.local
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { number: 80 } } }
